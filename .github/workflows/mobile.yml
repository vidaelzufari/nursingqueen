name: Mobile builds and beta releases
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      EXPO_APPLE_TEAM_ID: XR3BKK4C9Y
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add EXPO_TOKEN in repository Actions secrets.'
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify Expo project access
        run: eas project:info
      - name: Preview build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: eas build --platform ${{ matrix.platform }} --profile preview --non-interactive --wait
      - name: Validate release version and submission configuration
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/configure-release.cjs
      - name: Build and submit beta
        if: startsWith(github.ref, 'refs/tags/')
        run: eas build --platform ${{ matrix.platform }} --profile production --auto-submit-with-profile internal --non-interactive --wait
