name: Publish OTA update
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (requires an installed compatible build)
        type: choice
        options: [preview, production]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  update:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish compatible update
        env:
          CHANNEL: ${{ inputs.channel }}
        run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "GitHub $GITHUB_SHA" --non-interactive
