name: Build and submit to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  testflight:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      EXPO_APPLE_TEAM_ID: XR3BKK4C9Y
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate App Store app and version
        run: node scripts/configure-release.cjs --submission-only
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify Expo project
        run: eas project:info
      - name: Build iOS and enqueue TestFlight submission
        run: eas build --platform ios --profile production --auto-submit-with-profile internal --non-interactive --wait
